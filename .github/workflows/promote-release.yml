name: Promote Release to Stable

on:
    workflow_dispatch:
        inputs:
            existing_tag:
                description: "Existing pre-release tag to promote (e.g., v2.0.0-beta.2)"
                required: true
                type: string

            promote_to:
                description: "Stable version tag (e.g., v2.0.0)"
                required: true
                type: string

jobs:
    promote:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}
            DOCKERHUB_REPO: supersunho/adguardvpn-cli

        steps:
            - name: 🏷️ Validate tag formats
              env:
                  EXISTING_TAG: ${{ inputs.existing_tag }}
                  PROMOTE_TAG: ${{ inputs.promote_to }}
              run: |
                set -euo pipefail

                # Validate existing tag is a strict pre-release semver.
                if ! [[ "$EXISTING_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
                    echo "❌ existing_tag must be a pre-release semver (e.g., v2.0.0-beta.2)" >&2
                    exit 1
                fi
                if ! [[ "$PROMOTE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "❌ promote_to must be a stable semver without suffix (e.g., v2.0.0)" >&2
                    exit 1
                fi
                EXISTING_BASE="${EXISTING_TAG%%-*}"
                if [ "$EXISTING_BASE" != "$PROMOTE_TAG" ]; then
                    echo "❌ promote_to must match the pre-release base version: ${EXISTING_BASE} (got ${PROMOTE_TAG})" >&2
                    exit 1
                fi
                echo "✅ Tag formats are valid: $EXISTING_TAG → $PROMOTE_TAG"

            - name: 📦 Checkout
              uses: actions/checkout@v4
              with:
                ref: ${{ inputs.existing_tag }}
                fetch-tags: true
                fetch-depth: 0

            - name: 🔍 Verify release and target commit
              env:
                  EXISTING_TAG: ${{ inputs.existing_tag }}
                  PROMOTE_TAG: ${{ inputs.promote_to }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                set -euo pipefail

                if ! git rev-parse --verify "refs/tags/${EXISTING_TAG}^{commit}" >/dev/null 2>&1; then
                    echo "❌ Existing tag does not exist: ${EXISTING_TAG}" >&2
                    exit 1
                fi
                if git rev-parse --verify "refs/tags/${PROMOTE_TAG}^{commit}" >/dev/null 2>&1; then
                    echo "❌ Stable tag already exists: ${PROMOTE_TAG}" >&2
                    exit 1
                fi

                RELEASE_JSON=$(curl --fail --silent --show-error \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${EXISTING_TAG}")
                if [ "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" != "true" ]; then
                    echo "❌ ${EXISTING_TAG} is not a GitHub pre-release" >&2
                    exit 1
                fi

                TARGET_COMMIT=$(git rev-parse "refs/tags/${EXISTING_TAG}^{commit}")
                printf 'TARGET_COMMIT=%s\n' "$TARGET_COMMIT" >> "$GITHUB_ENV"
                echo "✅ Existing pre-release resolves to ${TARGET_COMMIT}"

            - name: 🛠️ Set up registry tooling
              uses: docker/setup-buildx-action@v3

            - name: 🔑 Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🔑 Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: 🐳 Promote multi-arch container images
              env:
                  EXISTING_TAG: ${{ inputs.existing_tag }}
                  PROMOTE_TAG: ${{ inputs.promote_to }}
                  GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_REPO }}
              run: |
                set -euo pipefail

                SOURCE_VERSION="${EXISTING_TAG#v}"
                TARGET_VERSION="${PROMOTE_TAG#v}"
                for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
                    source_ref="${image}:${SOURCE_VERSION}"
                    target_ref="${image}:${TARGET_VERSION}"
                    latest_ref="${image}:latest"

                    echo "🔍 Resolving source manifest: ${source_ref}"
                    source_digest=$(docker buildx imagetools inspect "$source_ref" \
                        --format '{{.Manifest.Digest}}')
                    [ -n "$source_digest" ] || {
                        echo "❌ Source manifest has no digest: ${source_ref}" >&2
                        exit 1
                    }

                    if docker buildx imagetools inspect "$target_ref" >/dev/null 2>&1; then
                        echo "❌ Stable image tag already exists: ${target_ref}" >&2
                        exit 1
                    fi

                    echo "🏷️ Retagging ${source_ref} → ${target_ref}"
                    docker buildx imagetools create --tag "$target_ref" "$source_ref"
                    echo "🏷️ Updating ${latest_ref} → ${target_ref}"
                    docker buildx imagetools create --tag "$latest_ref" "$target_ref"

                    target_digest=$(docker buildx imagetools inspect "$target_ref" \
                        --format '{{.Manifest.Digest}}')
                    latest_digest=$(docker buildx imagetools inspect "$latest_ref" \
                        --format '{{.Manifest.Digest}}')
                    if [ "$source_digest" != "$target_digest" ] || \
                       [ "$target_digest" != "$latest_digest" ]; then
                        echo "❌ Digest mismatch after promotion for ${image}" >&2
                        echo "   source=${source_digest} target=${target_digest} latest=${latest_digest}" >&2
                        exit 1
                    fi
                    echo "✅ ${image} stable/latest tags match source digest ${source_digest}"
                done

            - name: 📥 Download pre-release digest assets
              env:
                  EXISTING_TAG: ${{ inputs.existing_tag }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                set -euo pipefail
                rm -rf /tmp/release-digests
                mkdir -p /tmp/release-digests
                gh release download "$EXISTING_TAG" \
                    --repo "$GITHUB_REPOSITORY" \
                    --pattern 'digest-*.txt' \
                    --dir /tmp/release-digests \
                    --clobber
                shopt -s nullglob
                assets=(/tmp/release-digests/digest-*.txt)
                if [ "${#assets[@]}" -eq 0 ]; then
                    echo "❌ Pre-release has no digest assets to carry forward" >&2
                    exit 1
                fi

            - name: 🏷️ Create stable tag
              env:
                  EXISTING_TAG: ${{ inputs.existing_tag }}
                  PROMOTE_TAG: ${{ inputs.promote_to }}
              run: |
                set -euo pipefail
                git tag -a "$PROMOTE_TAG" "$TARGET_COMMIT" -m "Promote $EXISTING_TAG to stable $PROMOTE_TAG"
                git push origin "$PROMOTE_TAG"

            - name: 🔄 Update latest tag
              env:
                  PROMOTE_TAG: ${{ inputs.promote_to }}
              run: |
                set -euo pipefail
                git tag -f latest "$TARGET_COMMIT"
                git push origin -f latest

            - name: 🚀 Create Stable GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.promote_to }}
                  name: "AdGuard VPN CLI Release ${{ inputs.promote_to }}"
                  files: /tmp/release-digests/digest-*.txt
                  body: |
                    **Promoted from:** ${{ inputs.existing_tag }}

                    This stable release corresponds to the previously published pre-release.
                  prerelease: false
                  make_latest: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
