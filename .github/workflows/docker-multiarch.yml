name: AdGuard VPN CLI Builder

on:
    workflow_dispatch:
        inputs:
            runner:
                description: "Choose runner type"
                type: choice
                default: "ubuntu-latest"
                options:
                    - "ubuntu-24.04"
                    - "ubuntu-22.04"
                    - "ubuntu-24.04-arm"
                    - "ubuntu-22.04-arm"
                    - "ubuntu-latest"

            source_version:
                description: "AdGuard VPN CLI source version (e.g., v1.2.3, latest for newest)"
                required: false
                default: "latest"
                type: string

            build_version:
                description: "Project image and release version (e.g., 2.0.0-beta.1)"
                required: true
                type: string

            prerelease:
                description: "Mark the GitHub Release as a pre-release and suppress stable/latest tags"
                required: false
                default: false
                type: boolean

            verify_build:
                description: "Verify build functionality"
                required: false
                default: false
                type: boolean

            force_rebuild:
                description: "Force rebuild even if image exists"
                required: false
                default: false
                type: boolean

            clear_cache:
                description: "Clear build cache before building"
                required: false
                default: false
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.inputs.build_version || github.event.inputs.source_version || 'latest' }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    DOCKERHUB_REPO: supersunho/adguardvpn-cli
    DOCKER_BUILDKIT: 1
    BUILDKIT_PROGRESS: plain
    CACHE_VERSION: v1

permissions:
    contents: read

##############################################################################
# 1) Prepare version and matrix
##############################################################################
jobs:
    prepare:
        runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
        env:
            SOURCE_VERSION_INPUT: ${{ inputs.source_version || 'latest' }}
            BUILD_VERSION_INPUT: ${{ inputs.build_version }}
            PRERELEASE_INPUT: ${{ inputs.prerelease || false }}
            FORCE_REBUILD_INPUT: ${{ inputs.force_rebuild || 'false' }}
        outputs:
            source_version: ${{ steps.get-version.outputs.source_version }}
            source_version_clean: ${{ steps.get-version.outputs.source_version_clean }}
            source_version_base: ${{ steps.get-version.outputs.source_version_base }}
            source_version_exact: ${{ steps.get-version.outputs.source_version_exact }}
            build_version: ${{ steps.get-version.outputs.build_version }}
            build_version_clean: ${{ steps.get-version.outputs.build_version_clean }}
            build_version_tag: ${{ steps.get-version.outputs.build_version_tag }}
            build_version_base: ${{ steps.get-version.outputs.build_version_base }}
            prerelease: ${{ steps.get-version.outputs.prerelease }}
            publish_latest: ${{ steps.get-version.outputs.publish_latest }}
            release_tag: ${{ steps.get-version.outputs.release_tag }}
            matrix: ${{ steps.generate-matrix.outputs.matrix }}

        steps:
            - name: 🔍 Determine source and build versions
              id: get-version
              env:
                SOURCE_VERSION_INPUT: ${{ inputs.source_version || 'latest' }}
                BUILD_VERSION_INPUT: ${{ inputs.build_version }}
                PRERELEASE_INPUT: ${{ inputs.prerelease || false }}
              run: |
                  # Validate version inputs — accept "latest" or semver with optional v prefix
                  validate_version() {
                      local field="$1" value="$2"
                      if [ "$value" = "latest" ]; then
                          return 0
                      fi
                      # Strict semver regex: v?MAJOR.MINOR.PATCH with optional prerelease suffix
                      if ! echo "$value" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                          echo "ERROR: ${field}='${value}' is not a valid version (semver or 'latest' only)" >&2
                          exit 1
                      fi
                      # Reject shell metacharacters
                      if echo "$value" | grep -qE '[$`;\"'"'"'\\n]'; then
                          echo "ERROR: ${field} contains invalid characters" >&2
                          exit 1
                      fi
                  }

                  if [ -z "$BUILD_VERSION_INPUT" ]; then
                      echo "ERROR: build_version is required and must be independent from source_version" >&2
                      exit 1
                  fi

                  PRERELEASE_INPUT="${PRERELEASE_INPUT,,}"
                  case "$PRERELEASE_INPUT" in
                      true|false) ;;
                      *)
                          echo "ERROR: prerelease must be true or false" >&2
                          exit 1
                          ;;
                  esac

                  validate_version "source_version" "$SOURCE_VERSION_INPUT"
                  validate_version "build_version" "$BUILD_VERSION_INPUT"

                  # Step 1: Get AdGuard VPN CLI source version
                  if [ "$SOURCE_VERSION_INPUT" = "latest" ]; then
                    echo "🔍 Fetching latest AdGuard VPN CLI release from upstream..."
                    curl --fail --silent --show-error \
                      -o /tmp/adguardvpn-release.json \
                      https://api.github.com/repos/AdguardTeam/AdGuardVPNCLI/releases/latest
                    SOURCE_VERSION=$(jq -er '.tag_name // empty' /tmp/adguardvpn-release.json)
                    echo "📦 Latest upstream version: $SOURCE_VERSION"
                  else
                    SOURCE_VERSION="$SOURCE_VERSION_INPUT"
                    echo "📌 Using specified source version: $SOURCE_VERSION"
                  fi
                  if [[ "$SOURCE_VERSION" != v* ]]; then
                    SOURCE_VERSION="v${SOURCE_VERSION}"
                  fi
                  validate_version "resolved source_version" "$SOURCE_VERSION"

                  # Step 2: Determine the independent project build version
                  BUILD_VERSION="$BUILD_VERSION_INPUT"
                  echo "🏷️ Using project build version: $BUILD_VERSION"

                  # Step 3: Process version strings for Docker tags
                  SOURCE_VERSION_CLEAN=${SOURCE_VERSION#v}
                  BUILD_VERSION_CLEAN=${BUILD_VERSION#v}
                  BUILD_VERSION_TAG="$BUILD_VERSION_CLEAN"
                  SOURCE_VERSION_BASE=${SOURCE_VERSION_CLEAN%%-*}
                  BUILD_VERSION_BASE=${BUILD_VERSION_CLEAN%%-*}

                  if [ "$PRERELEASE_INPUT" = "true" ] && [[ "$BUILD_VERSION_TAG" != *-* ]]; then
                    echo "ERROR: prerelease=true requires a pre-release build_version such as 2.0.0-beta.1" >&2
                    exit 1
                  fi
                  if [ "$PRERELEASE_INPUT" = "false" ] && [[ "$BUILD_VERSION_TAG" == *-* ]]; then
                    echo "ERROR: prerelease=false cannot use a pre-release build_version: $BUILD_VERSION_TAG" >&2
                    exit 1
                  fi

                  if [ "$PRERELEASE_INPUT" = "true" ]; then
                    PUBLISH_LATEST=false
                  else
                    PUBLISH_LATEST=true
                  fi

                  RELEASE_TAG="v${BUILD_VERSION_TAG}"

                  # source_version_exact is the tag to install and verify
                  SOURCE_VERSION_EXACT="$SOURCE_VERSION"

                  echo ""
                  echo "📋 Version Summary:"
                  echo "├─ 🎯 AdGuard CLI Source    : $SOURCE_VERSION ($SOURCE_VERSION_CLEAN)"
                  echo "├─ 🏷️ Build/Release Tag     : $RELEASE_TAG"
                  echo "├─ 🔧 Source Base Version   : $SOURCE_VERSION_BASE"
                  echo "├─ 🚀 Build Version         : $BUILD_VERSION_TAG"
                  echo "├─ 🧪 Pre-release           : $PRERELEASE_INPUT"
                  echo "└─ 🏷️ Publish latest        : $PUBLISH_LATEST"
                  echo ""

                  printf '%s\n' \
                    "source_version=$SOURCE_VERSION" \
                    "source_version_clean=$SOURCE_VERSION_CLEAN" \
                    "source_version_base=$SOURCE_VERSION_BASE" \
                    "source_version_exact=$SOURCE_VERSION_EXACT" \
                    "build_version=$BUILD_VERSION" \
                    "build_version_clean=$BUILD_VERSION_CLEAN" \
                    "build_version_tag=$BUILD_VERSION_TAG" \
                    "build_version_base=$BUILD_VERSION_BASE" \
                    "prerelease=$PRERELEASE_INPUT" \
                    "publish_latest=$PUBLISH_LATEST" \
                    "release_tag=$RELEASE_TAG" \
                    >> "$GITHUB_OUTPUT"

            - name: 🏗️ Generate build matrix
              id: generate-matrix
              run: |
                  echo "📦 Generating multi-architecture build matrix..."
                  MATRIX=$(cat << 'MJEOF'
                  {
                    "include": [
                      { "arch": "amd64", "platform": "linux/amd64" },
                      { "arch": "arm64", "platform": "linux/arm64" },
                      { "arch": "armv7", "platform": "linux/arm/v7" }
                    ]
                  }
                  MJEOF
                  )
                  printf 'matrix=%s\n' "$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
                  echo "✅ Matrix generated with $(echo "$MATRIX" | jq '.include | length') architectures"

    ##############################################################################
    # 1b) Test suite — gates the build
    ##############################################################################
    shellcheck:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🔧 Install ShellCheck
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq shellcheck

            - name: 🔍 Show ShellCheck version
              run: shellcheck --version

            - name: 🧪 Run ShellCheck
              run: |
                  shellcheck --severity=error -x scripts/*.sh scripts/lib/*.sh tests/*.sh

    unit-tests:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🔧 Install dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq shellcheck jq

            - name: 🧪 Run unit tests
              run: |
                  cd tests && bash run_tests.sh unit

    actionlint:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🧪 Run actionlint
              run: |
                  docker run --rm \
                    -v "$(pwd):/repo" \
                    --workdir /repo \
                    rhysd/actionlint:latest

    ##############################################################################
    # 2) Build multi-arch images
    ##############################################################################
    build:
        needs: [prepare, shellcheck, unit-tests, actionlint]
        runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
        permissions:
            contents: read
            packages: write
        strategy:
            matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
            fail-fast: false
        env:
            FORCE_REBUILD_INPUT: ${{ inputs.force_rebuild || 'false' }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: 🎯 Display build target information
              run: |
                  echo "🎯 Building AdGuard VPN CLI container for: ${{ matrix.platform }}"
                  echo "📦 AdGuard CLI Source: ${{ needs.prepare.outputs.source_version }}"
                  echo "🏷️ Build Tag: ${{ needs.prepare.outputs.build_version_tag }}"
                  echo "🧪 Pre-release: ${{ needs.prepare.outputs.prerelease }}"
                  echo "🏗️ Architecture: ${{ matrix.arch }}"
                  echo "📦 Platform: ${{ matrix.platform }}"

            - name: 🔍 Check existing images via registry API
              id: check-images
              env:
                FORCE_REBUILD_INPUT: ${{ inputs.force_rebuild || 'false' }}
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  IMAGE_TAG="${{ needs.prepare.outputs.build_version_tag }}-${{ matrix.arch }}"
                  echo "🔍 Checking if image exists: $IMAGE_TAG"

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE_REBUILD_INPUT" = "true" ]; then
                    echo "🔄 Force rebuild enabled via workflow_dispatch"
                    echo "build_image=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  TOKEN="$GITHUB_TOKEN"
                  REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

                  echo "🔍 Checking GHCR for existing image..."
                  GHCR_RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
                    "https://api.github.com/user/packages/container/$REPO_NAME/versions" 2>/dev/null || echo '[]')

                  if echo "$GHCR_RESPONSE" | jq -e --arg TAG "$IMAGE_TAG" '.[] | select(.metadata.container.tags[]? == $TAG)' >/dev/null 2>&1; then
                    echo "✅ Image $IMAGE_TAG already exists in GHCR"
                    if [ "$FORCE_REBUILD_INPUT" = "true" ]; then
                      echo "🔄 Force rebuild enabled, proceeding anyway"
                      echo "build_image=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "⏭️ Skipping build (image exists, use force_rebuild to override)"
                      echo "build_image=false" >> "$GITHUB_OUTPUT"
                    fi
                  else
                    echo "❌ Image $IMAGE_TAG not found in GHCR, proceeding with build"
                    echo "build_image=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: 🏷️ Prepare image tags
              id: image-tags
              if: steps.check-images.outputs.build_image == 'true'
              env:
                IMAGE_VERSION: ${{ needs.prepare.outputs.build_version_tag }}
                PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
                GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_REPO }}
                ARCH: ${{ matrix.arch }}
              run: |
                  {
                    echo 'tags<<EOF'
                    echo "${GHCR_IMAGE}:${IMAGE_VERSION}-${ARCH}"
                    echo "${DOCKERHUB_IMAGE}:${IMAGE_VERSION}-${ARCH}"
                    if [ "$PUBLISH_LATEST" = "true" ]; then
                      echo "${GHCR_IMAGE}:latest-${ARCH}"
                      echo "${DOCKERHUB_IMAGE}:latest-${ARCH}"
                    fi
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: 📥 Checkout repository
              if: steps.check-images.outputs.build_image == 'true'
              uses: actions/checkout@v4

            - name: 🛠️ Set up QEMU
              if: steps.check-images.outputs.build_image == 'true'
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: ${{ matrix.platform }}

            - name: 🛠️ Set up Docker Buildx
              if: steps.check-images.outputs.build_image == 'true'
              uses: docker/setup-buildx-action@v3
              with:
                  driver: docker-container
                  use: true

            - name: 🔑 Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🔑 Login to Docker Hub
              if: steps.check-images.outputs.build_image == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: 📦 Initialize cache directories
              if: steps.check-images.outputs.build_image == 'true'
              run: |
                  mkdir -p /tmp/apt-cache /tmp/apt-lib
                  echo "📁 Cache directories initialized"

            - name: 💾 Cache build dependencies
              if: steps.check-images.outputs.build_image == 'true'
              uses: actions/cache@v4
              id: system-cache
              with:
                  path: |
                      /tmp/apt-cache
                      /tmp/apt-lib
                  key: ${{ env.CACHE_VERSION }}-adguard-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ needs.prepare.outputs.build_version_tag }}
                  restore-keys: |
                      ${{ env.CACHE_VERSION }}-adguard-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-

            - name: 🚀 Build and push (${{ matrix.platform }})
              if: steps.check-images.outputs.build_image == 'true'
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: true
                  no-cache: ${{ github.event.inputs.clear_cache == 'true' }}
                  cache-from: |
                      type=gha,scope=${{ env.CACHE_VERSION }}-adguard-${{ matrix.arch }}-${{ needs.prepare.outputs.build_version_tag }}
                  cache-to: |
                      type=gha,mode=max,scope=${{ env.CACHE_VERSION }}-adguard-${{ matrix.arch }}-${{ needs.prepare.outputs.build_version_tag }}
                  build-args: |
                      AGCLI_VERSION=${{ needs.prepare.outputs.source_version_exact }}
                  tags: ${{ steps.image-tags.outputs.tags }}
                  # Provenance attestation (SLSA) for supply-chain security.
                  provenance: true
                  sbom: true

            - name: 🧪 Comprehensive container verification
              if: steps.check-images.outputs.build_image == 'true' && github.event.inputs.verify_build == 'true'
              run: |
                  set -euo pipefail

                  IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.build_version_tag }}-${{ matrix.arch }}"
                  echo "🔍 Starting verification suite for ${{ matrix.arch }}..."

                  echo "📋 Test 1: Binary Verification"
                  docker run --rm --platform ${{ matrix.platform }} --entrypoint "" "$IMAGE" which adguardvpn-cli
                  echo " - ✅ AdGuard VPN CLI binary exists"

                  echo "📋 Test 2: Version Check"
                  docker run --rm --platform ${{ matrix.platform }} --entrypoint "" "$IMAGE" adguardvpn-cli --version
                  echo " - ✅ Version command working"

                  echo "📋 Test 3: Help Command"
                  docker run --rm --platform ${{ matrix.platform }} --entrypoint "" "$IMAGE" adguardvpn-cli --help >/dev/null
                  echo " - ✅ Help command working"

                  echo "🎉 Verification completed for ${{ matrix.arch }}!"

            - name: 📄 Export or resolve digest
              run: |
                  set -euo pipefail
                  mkdir -p /tmp/digests/${{ matrix.arch }}
                  if [ "${{ steps.check-images.outputs.build_image }}" = "true" ] && [ -n "${{ steps.build.outputs.digest }}" ]; then
                    # Build path: use the digest from the build output
                    echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.arch }}/digest.txt
                    echo "📝 Using build digest for ${{ matrix.arch }}"
                  else
                    # Skip path: resolve the existing image digest from the registry
                    echo "🔍 Resolving existing image digest for ${{ matrix.arch }}..."
                    IMAGE_TAG="${{ needs.prepare.outputs.build_version_tag }}-${{ matrix.arch }}"
                    IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
                    DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
                    if [ -n "$DIGEST" ]; then
                      echo "$DIGEST" > /tmp/digests/${{ matrix.arch }}/digest.txt
                      echo "📝 Resolved digest for existing ${{ matrix.arch }} image: ${DIGEST}"
                    else
                      echo "❌ Could not resolve digest for ${{ matrix.arch }} (image may not exist in registry)"
                      exit 1
                    fi
                  fi

            - name: 📤 Upload digest artifact
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.arch }}
                  path: /tmp/digests/${{ matrix.arch }}/digest.txt
                  retention-days: 1

            - name: 📊 Display cache utilization
              run: |
                  echo "📊 Cache Utilization Statistics:"
                  echo "🗂️ APT Cache: $(du -sh /tmp/apt-cache 2>/dev/null | cut -f1 || echo '0B')"
                  echo "🗂️ APT Lib: $(du -sh /tmp/apt-lib 2>/dev/null | cut -f1 || echo '0B')"
                  echo "💾 Cache Hit: ${{ steps.system-cache.outputs.cache-hit }}"

    ##############################################################################
    # 3) Merge multi-arch manifests
    ##############################################################################
    merge-manifests:
        needs: [prepare, build]
        if: always() && needs.build.result == 'success'
        runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: 📥 Download all digest artifacts
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: false

            - name: 🛠️ Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: 🔑 Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🔑 Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: 🏷️ Create multi-arch manifests
              run: |
                  # shellcheck disable=SC2086,SC2296
                  set -euo pipefail
                  VERSION="${{ needs.prepare.outputs.build_version_tag }}"
                  PUBLISH_LATEST="${{ needs.prepare.outputs.publish_latest }}"
                  echo "📦 Creating multi-arch manifests for version: $VERSION"

                  # Verify all three required architectures have digests
                  REQUIRED_ARCHS=(amd64 arm64 armv7)
                  MISSING=""
                  for arch in "${REQUIRED_ARCHS[@]}"; do
                    if [ -f "/tmp/digests/digests-$arch/digest.txt" ]; then
                      DIGEST=$(cat "/tmp/digests/digests-$arch/digest.txt" | head -1)
                      if [ -n "$DIGEST" ] && [ "$DIGEST" != "FAILED" ]; then
                        echo "✅ Confirmed $arch image: ${DIGEST}"
                      else
                        echo "❌ $arch digest is empty or marked failed"
                        MISSING="$MISSING $arch"
                      fi
                    else
                      echo "❌ $arch digest artifact not found"
                      MISSING="$MISSING $arch"
                    fi
                  done

                  if [ -n "$MISSING" ]; then
                    echo "❌ Cannot create manifests — missing architectures:$MISSING"
                    exit 1
                  fi

                  echo "🎯 All required architectures available: ${REQUIRED_ARCHS[*]}"

                  for registry in ghcr dockerhub; do
                    if [ "$registry" = "ghcr" ]; then
                      PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
                    else
                      PREFIX="${{ env.DOCKERHUB_REPO }}"
                    fi

                    ARCH_IMAGES=()

                    for arch in "${REQUIRED_ARCHS[@]}"; do
                      ARCH_IMAGES+=("${PREFIX}:${VERSION}-${arch}")
                    done

                    echo "🏗️ Creating version manifest: ${PREFIX}:${VERSION}"
                    docker buildx imagetools create \
                      --tag "${PREFIX}:${VERSION}" \
                      "${ARCH_IMAGES[@]}"

                    if [ "$PUBLISH_LATEST" = "true" ]; then
                      LATEST_ARCH_IMAGES=()
                      for arch in "${REQUIRED_ARCHS[@]}"; do
                        LATEST_ARCH_IMAGES+=("${PREFIX}:latest-${arch}")
                      done

                      echo "🏗️ Creating latest manifest: ${PREFIX}:latest"
                      docker buildx imagetools create \
                        --tag "${PREFIX}:latest" \
                        "${LATEST_ARCH_IMAGES[@]}"
                    else
                      echo "⏭️ Skipping latest manifest for pre-release"
                    fi

                    echo "✅ Multi-arch manifests created for $registry"
                  done

    ##############################################################################
    # 4) Build summary
    ##############################################################################
    summary:
        needs: [prepare, build]
        runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
        steps:
            - name: 📥 Download digest artifacts
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: false

            - name: 📊 Generate comprehensive build summary
              run: |
                  # shellcheck disable=SC2006,SC2012,SC2086,SC2288
                  AMD64_DIGEST=$(cat /tmp/digests/digests-amd64/digest.txt 2>/dev/null | cut -c1-12 || echo "N/A")
                  ARM64_DIGEST=$(cat /tmp/digests/digests-arm64/digest.txt 2>/dev/null | cut -c1-12 || echo "N/A")
                  ARMV7_DIGEST=$(cat /tmp/digests/digests-armv7/digest.txt 2>/dev/null | cut -c1-12 || echo "N/A")

                  AMD64_STATUS=$([ -f /tmp/digests/digests-amd64/digest.txt ] && echo "Success" || echo "Failed")
                  ARM64_STATUS=$([ -f /tmp/digests/digests-arm64/digest.txt ] && echo "Success" || echo "Failed")
                  ARMV7_STATUS=$([ -f /tmp/digests/digests-armv7/digest.txt ] && echo "Success" || echo "Failed")

                  BUILD_COUNT=$(find /tmp/digests -mindepth 2 -maxdepth 2 -name digest.txt -type f 2>/dev/null | wc -l | tr -d ' ' || echo "0")
                  BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
                  IMAGE_VERSION="${{ needs.prepare.outputs.build_version_tag }}"
                  PUBLISH_LATEST="${{ needs.prepare.outputs.publish_latest }}"
                  GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
                  DOCKERHUB_IMAGE="${{ env.DOCKERHUB_REPO }}"

                  DOCKERHUB_PULL_COMMANDS="docker pull ${DOCKERHUB_IMAGE}:${IMAGE_VERSION}"
                  GHCR_PULL_COMMANDS="docker pull ${GHCR_IMAGE}:${IMAGE_VERSION}"
                  if [ "$PUBLISH_LATEST" = "true" ]; then
                    DOCKERHUB_PULL_COMMANDS="${DOCKERHUB_PULL_COMMANDS}
                  docker pull ${DOCKERHUB_IMAGE}:latest"
                    GHCR_PULL_COMMANDS="${GHCR_PULL_COMMANDS}
                  docker pull ${GHCR_IMAGE}:latest"
                  fi

                  cat >> "$GITHUB_STEP_SUMMARY" << MJEOF
                  # 🚀 AdGuard VPN CLI Multi-Architecture Build Summary

                  **Build Date**: $BUILD_DATE
                  **AdGuard VPN CLI Source Version**: ${{ needs.prepare.outputs.source_version }}
                  **Build/Release Tag**: ${{ needs.prepare.outputs.build_version_tag }}
                  **Pre-release**: ${{ needs.prepare.outputs.prerelease }}
                  **Source Release Tag**: ${{ needs.prepare.outputs.source_version }}
                  **Build Number**: #${{ github.run_number }}
                  **Repository**: [${{ github.repository }}](https://github.com/${{ github.repository }})
                  **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

                  ## 🏗️ Multi-Architecture Build Results

                  ### 📦 Container Image Digests
                  | Architecture | Digest | Status |
                  |--------------|--------|--------|
                  | **amd64** | \`${AMD64_DIGEST}...\` | ${AMD64_STATUS} |
                  | **arm64** | \`${ARM64_DIGEST}...\` | ${ARM64_STATUS} |
                  | **armv7** | \`${ARMV7_DIGEST}...\` | ${ARMV7_STATUS} |

                  ### 🐳 Published Container Registries with Auto-Detection

                  #### 🎯 Docker Hub - Smart Architecture Detection
                  \`\`\`
                  ${DOCKERHUB_PULL_COMMANDS}
                  \`\`\`

                  #### 🔄 GitHub Container Registry (GHCR) - Smart Architecture Detection
                  \`\`\`
                  ${GHCR_PULL_COMMANDS}
                  \`\`\`

                  **🎉 AdGuard VPN CLI multi-architecture build completed successfully!**
                  **📊 Total Architectures Built**: $BUILD_COUNT

                  *Generated by AdGuard VPN CLI Builder • Build #${{ github.run_number }}*
                  MJEOF

    ##############################################################################
    # 5) Create GitHub Release
    ##############################################################################
    create-release:
        needs: [prepare, merge-manifests, summary]
        if: always() && needs.merge-manifests.result == 'success'
        runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
        permissions:
            contents: write
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📥 Download digest artifacts
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: false

            - name: 📦 Prepare release digest assets
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  digest_files=(/tmp/digests/digests-*/digest.txt)
                  if [ "${#digest_files[@]}" -eq 0 ]; then
                    echo "❌ No digest files found"
                    exit 1
                  fi
                  for digest_file in "${digest_files[@]}"; do
                    arch=$(basename "$(dirname "$digest_file")" | sed 's/^digests-//')
                    cp "$digest_file" "/tmp/digests/digest-${arch}.txt"
                  done

            - name: 🕐 Set current date
              run: echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

            - name: 📝 Generate release notes
              id: release-notes
              run: |
                  CURRENT_TAG="${{ needs.prepare.outputs.release_tag }}"
                  PREV_TAG=$(git tag --merged HEAD --sort=-v:refname | awk -v current_tag="$CURRENT_TAG" '$0 != current_tag { print; exit }')
                  if [ -z "$PREV_TAG" ]; then
                    echo "🔍 No previous tag found, using initial commit"
                    PREV_TAG=$(git rev-list --max-parents=0 HEAD)
                  else
                    echo "🔍 Previous tag found: $PREV_TAG"
                  fi

                  FEATURES=""
                  BUG_FIXES=""
                  CHORES=""
                  DOCS=""
                  REFACTOR=""
                  TESTS=""
                  OTHERS=""

                  while IFS= read -r line; do
                    if [ -n "$line" ]; then
                      COMMIT_HASH=$(echo "$line" | cut -d'|' -f1)
                      COMMIT_SUBJECT=$(echo "$line" | cut -d'|' -f2-)

                      if [[ $COMMIT_SUBJECT =~ ^(feat|feature|enhance|add)(\(.+\))?:[[:space:]]* ]]; then
                        FEATURES="${FEATURES}- ${COMMIT_SUBJECT} (${COMMIT_HASH})"$'\n'
                      elif [[ $COMMIT_SUBJECT =~ ^(fix|bug|patch)(\(.+\))?:[[:space:]]* ]]; then
                        BUG_FIXES="${BUG_FIXES}- ${COMMIT_SUBJECT} (${COMMIT_HASH})"$'\n'
                      elif [[ $COMMIT_SUBJECT =~ ^(docs|doc)(\(.+\))?:[[:space:]]* ]]; then
                        DOCS="${DOCS}- ${COMMIT_SUBJECT} (${COMMIT_HASH})"$'\n'
                      elif [[ $COMMIT_SUBJECT =~ ^(chore|build|ci|perf|style|test|refactor)(\(.+\))?:[[:space:]]* ]]; then
                        if [[ $COMMIT_SUBJECT =~ ^refactor ]]; then
                          REFACTOR="${REFACTOR}- ${COMMIT_SUBJECT} (${COMMIT_HASH})"$'\n'
                        elif [[ $COMMIT_SUBJECT =~ ^test ]]; then
                          TESTS="${TESTS}- ${COMMIT_SUBJECT} (${COMMIT_HASH})"$'\n'
                        else
                          CHORES="${CHORES}- ${COMMIT_SUBJECT} (${COMMIT_HASH})"$'\n'
                        fi
                      else
                        OTHERS="${OTHERS}- ${COMMIT_SUBJECT} (${COMMIT_HASH})"$'\n'
                      fi
                    fi
                  done < <(git log --oneline "${PREV_TAG}..HEAD" --pretty=format:"%h|%s" | sort -k2)

                  RELEASE_NOTES="# 🚀 AdGuard VPN CLI Release ${{ needs.prepare.outputs.build_version }}"
                  RELEASE_NOTES="${RELEASE_NOTES}

                  **Build Date**: ${{ env.BUILD_DATE }}
                  **AdGuard VPN CLI Source Version**: ${{ needs.prepare.outputs.source_version }}
                  **Build/Release Version**: ${{ needs.prepare.outputs.build_version_tag }}
                  **Pre-release**: ${{ needs.prepare.outputs.prerelease }}

                  ## 📋 Changelog
                  "

                  [ -n "$FEATURES" ] && RELEASE_NOTES="${RELEASE_NOTES}
                  ### ✨ Features
                  ${FEATURES}
                  "
                  [ -n "$BUG_FIXES" ] && RELEASE_NOTES="${RELEASE_NOTES}
                  ### 🐛 Bug Fixes
                  ${BUG_FIXES}
                  "
                  [ -n "$REFACTOR" ] && RELEASE_NOTES="${RELEASE_NOTES}
                  ### 🔧 Refactoring
                  ${REFACTOR}
                  "
                  [ -n "$TESTS" ] && RELEASE_NOTES="${RELEASE_NOTES}
                  ### 🧪 Tests
                  ${TESTS}
                  "
                  [ -n "$DOCS" ] && RELEASE_NOTES="${RELEASE_NOTES}
                  ### 📚 Documentation
                  ${DOCS}
                  "
                  [ -n "$CHORES" ] && RELEASE_NOTES="${RELEASE_NOTES}
                  ### 📦 Chores
                  ${CHORES}
                  "

                  echo -e "$RELEASE_NOTES" > release-notes.txt
                  {
                    echo 'body<<EOF'
                    echo -e "$RELEASE_NOTES"
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

                  echo "✅ Release notes generated"

            - name: 🏷️ Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.prepare.outputs.release_tag }}
                  target_commitish: ${{ github.sha }}
                  name: "AdGuard VPN CLI Release ${{ needs.prepare.outputs.release_tag }}"
                  body: ${{ steps.release-notes.outputs.body }}
                  files: /tmp/digests/digest-*.txt
                  draft: false
                  prerelease: ${{ needs.prepare.outputs.prerelease }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
