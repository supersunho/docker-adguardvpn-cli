version: "3"
services:
    adguard-vpn-cli:
        image: supersunho/adguardvpn-cli:latest
        restart: unless-stopped
        container_name: adguard-vpn-cli
        env_file: .env
        volumes:
            - ./data:/home/appuser/.local/share/adguardvpn-cli
        healthcheck:
            # Check for "Connected" in CLI output rather than relying on exit code alone.
            # The CLI may exit 0 even when disconnected, so we verify the connection text.
            test: ["CMD-SHELL", "adguardvpn-cli status 2>&1 | grep -qE '(Connected|connected)' || exit 1"]
            interval: 1m
            timeout: 10s
            retries: 5
            start_period: 5m
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun
        ports:
            - "1080:1080"
            - 6089:6089
            - 6881:6881
            - 6881:6881/udp
