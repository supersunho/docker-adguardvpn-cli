services:
    adguard-vpn-cli:
        image: supersunho/adguardvpn-cli:latest
        restart: unless-stopped
        container_name: adguard-vpn-cli
        env_file: .env
        volumes:
            - ./data:/home/appuser/.local/share/adguardvpn-cli
        healthcheck:
            # Mode-aware healthcheck (scripts/healthcheck.sh):
            # always requires adguardvpn-cli to report an active connection
            # (same regex as check_adguard_vpn_status() in vpn_status.sh), and
            # in SOCKS mode also verifies the SOCKS5 listener accepts a bare
            # TCP connection without exchanging credentials.
            test: ["CMD", "/opt/adguardvpn_cli/scripts/healthcheck.sh"]
            interval: 1m
            timeout: 10s
            retries: 5
            start_period: 5m
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun
        ports:
            - "127.0.0.1:1080:1080"          # SOCKS5 proxy (when CONNECTION_TYPE=SOCKS)
            - "127.0.0.1:6089:6089"          # AdGuard internal API / DNS proxy
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: '1.0'
